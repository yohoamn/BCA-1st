<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heading and Font Tags</title>
</head>
<body>
    <h1>Heading 1</h1>
    <h2>Heading 2</h2>
    <h3>Heading 3</h3>
    <h4>Heading 4</h4>
    <h5>Heading 5</h5>
    <h6>Heading 6</h6>
    <font face="Arial" size="5" color="red">This text is in Arial font, size 5, and red color.</font>
    <!-- this is an example of Font tag in HTML -->
    <p>
        <font face = "Times New Roman" size = "4" color = "blue">This text uses different font size and color.</font>
    </p>
</body>
</html>
